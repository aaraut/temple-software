server:
  port: 8080

spring:
  datasource:
    url: jdbc:postgresql://localhost:5432/templedb?options=-c%20TimeZone=Asia/Kolkata
    username: temple
    password: temple123
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: update   # only for development
    show-sql: true
    properties:
      hibernate:
        format_sql: true

  sql:
    init:
      mode: never   # no auto .sql scripts for now

  flyway:
    baseline-on-migrate: true   # existing schema was created by ddl-auto:update, not Flyway —
    baseline-version: 0         # treat it as "version 0" so V1__... can apply on top of it

logging:
  level:
    org.springframework: INFO

management:
  endpoints:
    web:
      exposure:
        include: health,info
